<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Posts · Boisdale Fire Station 34</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .manage-wrap {
      max-width: 860px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .manage-header-card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 1.5rem 2rem;
      margin-bottom: 1.5rem;
    }
    h2.manage-title {
      margin: 0 0 1.25rem;
      font-size: 1.3rem;
      color: #222;
    }
    .token-row {
      display: flex;
      gap: .5rem;
      margin-top: .4rem;
    }
    .token-row input {
      flex: 1;
      padding: .55rem .75rem;
      border: 1px solid #d4aa40;
      border-radius: 5px;
      font-family: monospace;
      font-size: 1rem;
      background: #fff;
    }
    .btn-load {
      padding: .55rem 1.25rem;
      background: #1a5c2a;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-weight: 700;
      font-size: .95rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-load:hover { background: #154a22; }
    .btn-load:disabled { background: #bbb; cursor: not-allowed; }

    /* Status message */
    #manage-status {
      display: none;
      margin-top: .75rem;
      padding: .6rem 1rem;
      border-radius: 5px;
      font-size: .9rem;
    }
    #manage-status.success { background: #eafaf1; border: 1px solid #a9dfbf; color: #1e6b3a; }
    #manage-status.error   { background: #fdecea; border: 1px solid #f5aca6; color: #922b21; }
    #manage-status.loading { background: #eaf4fb; border: 1px solid #aed6f1; color: #1a5276; }

    /* Post rows */
    .post-item {
      margin-bottom: .4rem;
    }
    .post-row {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: .7rem 1rem;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      cursor: default;
    }
    .post-row-badge { flex-shrink: 0; }
    .post-row-date {
      color: #888;
      font-size: .82rem;
      white-space: nowrap;
      flex-shrink: 0;
      font-family: var(--font-ui, sans-serif);
    }
    .post-row-title {
      flex: 1;
      font-weight: 600;
      color: #222;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .post-row-actions {
      display: flex;
      gap: .4rem;
      flex-shrink: 0;
    }
    .btn-edit {
      padding: .3rem .75rem;
      background: #e8f0fe;
      border: 1px solid #aac4f8;
      color: #1a4abf;
      border-radius: 4px;
      cursor: pointer;
      font-size: .82rem;
      font-weight: 600;
    }
    .btn-edit:hover, .btn-edit.active { background: #d0e1fc; }
    .btn-del {
      padding: .3rem .75rem;
      background: #fdecea;
      border: 1px solid #f5aca6;
      color: #922b21;
      border-radius: 4px;
      cursor: pointer;
      font-size: .82rem;
      font-weight: 600;
    }
    .btn-del:hover { background: #fbd7d4; }

    /* Inline edit panel */
    .edit-panel {
      display: none;
      background: #f8f9ff;
      border: 1px solid #c5d3f5;
      border-top: none;
      border-radius: 0 0 6px 6px;
      padding: 1.25rem 1.5rem 1rem;
      margin-top: -4px;
    }
    .edit-panel.open { display: block; }
    .post-row.editing {
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
      border-color: #c5d3f5;
    }

    .edit-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .75rem 1rem;
    }
    @media (max-width: 540px) { .edit-grid { grid-template-columns: 1fr; } }
    .edit-grid .span2 { grid-column: 1 / -1; }
    .edit-grid label {
      display: block;
      font-weight: 600;
      font-size: .85rem;
      color: #333;
      margin-bottom: .3rem;
    }
    .edit-grid input[type="text"],
    .edit-grid input[type="date"],
    .edit-grid select,
    .edit-grid textarea {
      width: 100%;
      padding: .5rem .65rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: .95rem;
      font-family: inherit;
      box-sizing: border-box;
    }
    .edit-grid textarea { min-height: 100px; resize: vertical; }

    .edit-actions {
      display: flex;
      gap: .5rem;
      margin-top: 1rem;
      align-items: center;
    }
    .btn-save {
      padding: .5rem 1.25rem;
      background: #1a5c2a;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-weight: 700;
      cursor: pointer;
      font-size: .92rem;
    }
    .btn-save:hover { background: #154a22; }
    .btn-cancel {
      padding: .5rem 1rem;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 5px;
      cursor: pointer;
      font-size: .92rem;
    }
    .btn-cancel:hover { background: #f5f5f5; }
    .edit-status {
      display: none;
      font-size: .85rem;
      margin-left: .5rem;
    }
    .edit-status.success { color: #1e6b3a; }
    .edit-status.error   { color: #922b21; }
    .edit-status.loading { color: #1a5276; }

    .attachment-note {
      font-size: .8rem;
      color: #888;
      margin-top: .25rem;
    }
    .empty-msg { color: #888; font-style: italic; padding: 1rem 0; }

    /* Attachment editing */
    .attachment-block { margin-top: .2rem; }
    .attachment-row {
      display: flex;
      align-items: center;
      gap: .6rem;
      padding: .4rem .6rem;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 5px;
      margin-bottom: .5rem;
    }
    .attachment-row img.attachment-thumb {
      width: 36px;
      height: 36px;
      object-fit: cover;
      border-radius: 4px;
      flex-shrink: 0;
      background: #f0f0f0;
    }
    .attachment-row .attachment-icon {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      flex-shrink: 0;
    }
    .attachment-row .attachment-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: .88rem;
      color: #333;
    }
    .btn-att-remove {
      padding: .25rem .6rem;
      background: #fdecea;
      border: 1px solid #f5aca6;
      color: #922b21;
      border-radius: 4px;
      cursor: pointer;
      font-size: .78rem;
      font-weight: 600;
      flex-shrink: 0;
    }
    .btn-att-remove:hover { background: #fbd7d4; }
    .attachment-removed-note {
      display: none;
      font-size: .85rem;
      color: #922b21;
      margin-bottom: .5rem;
    }
    .attachment-removed-note.show { display: block; }
    .btn-link {
      background: none;
      border: none;
      color: #1a4abf;
      text-decoration: underline;
      cursor: pointer;
      font-size: .85rem;
      padding: 0;
      margin-left: .3rem;
    }
    .attachment-block input[type="file"] {
      font-size: .85rem;
    }

    /* Category + status grouping */
    .cat-group { margin-bottom: 2rem; }
    .cat-group-header {
      font-family: var(--font-ui, sans-serif);
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      background: var(--primary, #1a5c2a);
      padding: .4rem .9rem;
      border-radius: 5px;
      margin-bottom: .75rem;
      letter-spacing: .03em;
    }
    .status-group { margin-bottom: 1rem; padding-left: .75rem; border-left: 3px solid #eee; }
    .status-group-header {
      font-family: var(--font-ui, sans-serif);
      font-size: .75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: .4rem;
      padding: .15rem 0;
    }
    .status-active   { color: #1a7a3a; border-left-color: #1a7a3a; }
    .status-future   { color: #1a4abf; }
    .status-expired  { color: #888; }
    .status-group.active-group  { border-left-color: #a8d5b5; }
    .status-group.future-group  { border-left-color: #aac4f8; }
    .status-group.expired-group { border-left-color: #ddd; }
  </style>
</head>

  <header id="site-header">
    <div class="header-inner">
      <div class="site-title">🔥 Boisdale Fire Station 34</div>
      <nav>
        <a href="index.html">Home</a>

      </nav>

  <div class="manage-wrap">

    <div class="manage-header-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;">
        <h2 class="manage-title" style="margin:0;">Manage Posts</h2>
        <a href="upload.html" style="padding:.45rem 1rem;background:#c0392b;color:#fff;border-radius:5px;font-weight:700;font-size:.9rem;text-decoration:none;">+ New Post</a>
      </div>

      <div class="token-group">
        <label for="manage-token">Contributor Token</label>

          <input type="password" id="manage-token" placeholder="Enter your shared token" autocomplete="off">

  <footer id="site-footer">
    <div class="container">

  <script src="js/config.js"></script>
  <script>
    // ── Token persistence ─────────────────────────────────────────────────────
    const tokenInput = document.getElementById('manage-token');
    const saved = localStorage.getItem('bs34_post_token');
    if (saved) tokenInput.value = saved;
    tokenInput.addEventListener('change', () => {
      if (tokenInput.value) localStorage.setItem('bs34_post_token', tokenInput.value);
    });

    function getToken() { return tokenInput.value.trim(); }

    // ── State ─────────────────────────────────────────────────────────────────
    let posts = []; // [{ sheetRow, row: [] }]
    let editState = {}; // idx -> { fileUrl, fileName, fileType, newFile, remove }

    // ── Load ──────────────────────────────────────────────────────────────────
    async function loadPosts() {
      const token = getToken();
      if (token) localStorage.setItem('bs34_post_token', token);

      const btn = document.getElementById('btn-load');
      btn.disabled = true;
      showStatus('Loading…', 'loading');

      try {
        const url = `https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.SPREADSHEET_ID}/values/Posts?key=${CONFIG.GOOGLE_API_KEY}`;
        const res  = await fetch(url);
        const data = await res.json();

        if (data.error) {
          showStatus('Could not load posts: ' + data.error.message, 'error');
          return;
        }

        const allRows = data.values || [];
        // Skip header row; compute 1-based sheet row from array index
        posts = allRows.slice(1)
          .map((row, i) => ({ sheetRow: i + 2, row }))
          .reverse(); // newest first

        showStatus('', '');
        renderList();
      } catch (err) {
        showStatus('Network error — ' + err.message, 'error');
      } finally {
        btn.disabled = false;
      }
    }

    // ── Classify post by date status ──────────────────────────────────────────
    function classifyPost(row) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const startDate = row[8] ? new Date(row[8] + 'T00:00:00') : null;
      const endDate   = row[9] ? new Date(row[9] + 'T00:00:00') : null;
      if (endDate && endDate < today) return 'Expired';
      if (startDate && startDate > today) return 'Future';
      return 'Active';
    }

    // ── Render list ───────────────────────────────────────────────────────────
    function renderList() {
      const container = document.getElementById('posts-list');
      if (!posts.length) {
        container.innerHTML = '<p class="empty-msg">No posts found in the Posts tab.</p>';
        return;
      }

      const categories = ['Notice', 'FireDept', 'Community', 'Projects'];
      const catLabels  = { Notice: 'Notice', FireDept: 'Fire Dept', Community: 'Community', Projects: 'Project Updates' };
      const statuses   = ['Active', 'Future', 'Expired'];

      let html = '';

      categories.forEach(cat => {
        const catPosts = posts.filter(p => (p.row[2] || '').trim() === cat);
        if (!catPosts.length) return;

        html += `<div class="cat-group"><div class="cat-group-header">${catLabels[cat]}</div>`;

        statuses.forEach(status => {
          const group = catPosts.filter(p => classifyPost(p.row) === status);
          if (!group.length) return;

          html += `<div class="status-group ${status.toLowerCase()}-group">
            <div class="status-group-header status-${status.toLowerCase()}">${status}</div>`;

          group.forEach(p => {
            const idx   = posts.indexOf(p);
            const date  = p.row[1] || '';
            const title = esc(p.row[3] || 'Untitled');
            html += `
              <div class="post-item" id="item-${idx}">
                <div class="post-row" id="row-${idx}">
                  <div class="post-row-date">${date}</div>
                  <div class="post-row-title" title="${title}">${title}</div>
                  <div class="post-row-actions">
                    <button class="btn-edit" id="editbtn-${idx}" onclick="toggleEdit(${idx})">Edit</button>
                    <button class="btn-del" onclick="deletePost(${idx})">Delete</button>
                  </div>
                </div>
                <div class="edit-panel" id="edit-${idx}">
                  ${buildEditForm(idx, p)}
                </div>
              </div>`;
          });

          html += `</div>`; // status-group
        });

        html += `</div>`; // cat-group
      });

      container.innerHTML = html || '<p class="empty-msg">No posts found.</p>';
    }

    // ── Edit form ─────────────────────────────────────────────────────────────
    function buildEditForm(idx, p) {
      const [, date, cat, title, body, fileUrl, fileName, fileType, startDate, endDate] = p.row;
      const cats = ['Notice', 'FireDept', 'Community', 'Projects'];
      const catOptions = cats.map(c =>
        `<option value="${c}" ${c === cat ? 'selected' : ''}>${c === 'Projects' ? 'Project Update' : c}</option>`
      ).join('');

      // Track this post's original attachment + edit state (new file / removal) in memory.
      editState[idx] = { fileUrl, fileName, fileType, newFile: null, remove: false };

      return `
        <div class="edit-grid">
          <div>
            <label>Category</label>
            <select id="ec-${idx}">${catOptions}</select>
          </div>
          <div>
            <label>Post Date</label>
            <input type="date" id="ed-${idx}" value="${esc(date || '')}">
          </div>
          <div>
            <label>Visible From <span style="font-weight:400;color:#999;">(optional)</span></label>
            <input type="date" id="es-${idx}" value="${esc(startDate || '')}">
          </div>
          <div>
            <label>Visible Until <span style="font-weight:400;color:#999;">(optional)</span></label>
            <input type="date" id="ee-${idx}" value="${esc(endDate || '')}">
          </div>
          <div class="span2">
            <label>Title</label>
            <input type="text" id="et-${idx}" value="${esc(title || '')}">
          </div>
          <div class="span2">
            <label>Body</label>
            <textarea id="eb-${idx}">${esc(body || '')}</textarea>
          </div>
          <div class="span2 attachment-block">
            <label>Attachment</label>
            ${buildAttachmentRow(idx)}
            <input type="file" id="ef-${idx}" accept="image/jpeg,image/png,image/gif,image/webp,application/pdf" onchange="handleEditFileSelected(${idx})">
            <div class="attachment-note" id="ef-note-${idx}"></div>
          </div>
        </div>
        <div class="edit-actions">
          <button class="btn-save" onclick="saveEdit(${idx}, ${p.sheetRow})">Save Changes</button>
          <button class="btn-cancel" onclick="toggleEdit(${idx})">Cancel</button>
          <span class="edit-status" id="es-msg-${idx}"></span>
        </div>`;
    }

    // ── Attachment row (current file + remove button, or removed notice) ──────
    function driveThumbUrl(url) {
      const m = String(url || '').match(/[-\w]{25,}/);
      return m ? `https://drive.google.com/thumbnail?id=${m[0]}&sz=w100` : '';
    }

    function buildAttachmentRow(idx) {
      const st = editState[idx];
      if (st.newFile) {
        const verb = st.fileUrl ? 'Will replace with' : 'Will attach';
        return `<div class="attachment-row" id="att-current-${idx}">
          <div class="attachment-icon">${st.newFile.type === 'application/pdf' ? '📄' : '🖼️'}</div>
          <span class="attachment-name" title="${esc(st.newFile.name)}">${verb}: ${esc(st.newFile.name)} (${formatBytes(st.newFile.size)})</span>
          <button type="button" class="btn-att-remove" onclick="cancelNewFile(${idx})">Cancel</button>
        </div>`;
      }
      if (st.remove) {
        return `<div class="attachment-removed-note show" id="att-removed-${idx}">
          Attachment will be removed when you save.
          <button type="button" class="btn-link" onclick="undoRemoveAttachment(${idx})">Undo</button>
        </div>`;
      }
      if (!st.fileUrl) {
        return `<div class="attachment-note">No attachment. Choose a file below to add one.</div>`;
      }
      const isImage = (st.fileType || '').startsWith('image/');
      const thumb   = isImage ? driveThumbUrl(st.fileUrl) : '';
      const thumbHtml = thumb
        ? `<img class="attachment-thumb" src="${thumb}" alt="">`
        : `<div class="attachment-icon">${st.fileType === 'application/pdf' ? '📄' : '📎'}</div>`;
      return `<div class="attachment-row" id="att-current-${idx}">
        ${thumbHtml}
        <span class="attachment-name" title="${esc(st.fileName || st.fileUrl)}">${esc(st.fileName || st.fileUrl)}</span>
        <button type="button" class="btn-att-remove" onclick="markRemoveAttachment(${idx})">Remove</button>
      </div>`;
    }

    function refreshAttachmentRow(idx) {
      const container = document.querySelector(`#edit-${idx} .attachment-block`);
      if (!container) return;
      // Replace just the first child (the attachment status row), leave the file input + note in place.
      const first = container.children[1]; // 0 = label, 1 = status row
      first.outerHTML = buildAttachmentRow(idx);
    }

    // ── Remove / undo remove ─────────────────────────────────────────────────
    function markRemoveAttachment(idx) {
      editState[idx].remove = true;
      refreshAttachmentRow(idx);
    }

    function undoRemoveAttachment(idx) {
      editState[idx].remove = false;
      refreshAttachmentRow(idx);
    }

    function cancelNewFile(idx) {
      editState[idx].newFile = null;
      document.getElementById(`ef-${idx}`).value = '';
      document.getElementById(`ef-note-${idx}`).textContent = '';
      refreshAttachmentRow(idx);
    }

    // ── New file chosen to replace/add attachment ───────────────────────────
    function handleEditFileSelected(idx) {
      const input = document.getElementById(`ef-${idx}`);
      const note  = document.getElementById(`ef-note-${idx}`);
      const file  = input.files[0];
      if (!file) { editState[idx].newFile = null; note.textContent = ''; refreshAttachmentRow(idx); return; }

      const allowed = ['image/jpeg', 'image/png', 'image/gif', 'image/webp', 'application/pdf'];
      if (!allowed.includes(file.type)) {
        note.textContent = 'Only JPG, PNG, GIF, WEBP, or PDF files are allowed.';
        input.value = '';
        editState[idx].newFile = null;
        return;
      }
      if (file.size > 10 * 1024 * 1024) {
        note.textContent = 'File must be 10 MB or smaller.';
        input.value = '';
        editState[idx].newFile = null;
        return;
      }

      editState[idx].newFile = file;
      editState[idx].remove = false; // a new file replaces "remove" intent
      note.textContent = '';
      refreshAttachmentRow(idx);
    }

    function formatBytes(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload  = e => resolve(e.target.result.split(',')[1]); // strip data URI prefix
        reader.onerror = () => reject(new Error('FileReader error'));
        reader.readAsDataURL(file);
      });
    }

    // ── Toggle edit panel ─────────────────────────────────────────────────────
    function toggleEdit(idx) {
      const panel  = document.getElementById(`edit-${idx}`);
      const row    = document.getElementById(`row-${idx}`);
      const btn    = document.getElementById(`editbtn-${idx}`);
      const isOpen = panel.classList.contains('open');
      // Close any other open panels first
      document.querySelectorAll('.edit-panel.open').forEach(p => p.classList.remove('open'));
      document.querySelectorAll('.post-row.editing').forEach(r => r.classList.remove('editing'));
      document.querySelectorAll('.btn-edit.active').forEach(b => b.classList.remove('active'));
      if (!isOpen) {
        panel.classList.add('open');
        row.classList.add('editing');
        btn.classList.add('active');
      }
    }

    // ── Save edit ─────────────────────────────────────────────────────────────
    async function saveEdit(idx, sheetRow) {
      const token = getToken();
      const msgEl = document.getElementById(`es-msg-${idx}`);

      const payload = {
        action:     'edit',
        token,
        sheetRow,
        category:   document.getElementById(`ec-${idx}`).value,
        date:       document.getElementById(`ed-${idx}`).value,
        title:      document.getElementById(`et-${idx}`).value,
        body:       document.getElementById(`eb-${idx}`).value,
        start_date: document.getElementById(`es-${idx}`).value,
        end_date:   document.getElementById(`ee-${idx}`).value,
      };

      const st = editState[idx];
      if (st && st.newFile) {
        setEditStatus(msgEl, 'Reading file…', 'loading');
        try {
          payload.fileBase64 = await fileToBase64(st.newFile);
          payload.fileName   = st.newFile.name;
          payload.fileType   = st.newFile.type;
        } catch (err) {
          setEditStatus(msgEl, 'Failed to read the file. Please try again.', 'error');
          return;
        }
      } else if (st && st.remove) {
        payload.removeFile = true;
      }

      setEditStatus(msgEl, 'Saving…', 'loading');

      try {
        const res  = await fetch(CONFIG.APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(payload)
        });
        const json = await res.json();
        if (json.status === 'ok') {
          setEditStatus(msgEl, '✅ Saved!', 'success');
          setTimeout(() => loadPosts(), 900);
        } else {
          setEditStatus(msgEl, 'Error: ' + json.message, 'error');
        }
      } catch (err) {
        setEditStatus(msgEl, 'Network error.', 'error');
      }
    }

    // ── Delete ────────────────────────────────────────────────────────────────
    async function deletePost(idx) {
      const p     = posts[idx];
      const title = p.row[3] || 'this post';
      if (!confirm(`Delete "${title}"?\n\nThis cannot be undone.`)) return;

      const token = getToken();
      showStatus('Deleting…', 'loading');

      try {
        const res  = await fetch(CONFIG.APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: 'delete', token, sheetRow: p.sheetRow })
        });
        const json = await res.json();
        if (json.status === 'ok') {
          showStatus('Post deleted.', 'success');
          setTimeout(() => loadPosts(), 600);
        } else {
          showStatus('Error: ' + json.message, 'error');
        }
      } catch (err) {
        showStatus('Network error.', 'error');
      }
    }

    // ── Helpers ───────────────────────────────────────────────────────────────
    function showStatus(msg, type) {
      const el = document.getElementById('manage-status');
      if (!msg) { el.style.display = 'none'; return; }
      el.textContent = msg;
      el.className   = type;
      el.style.display = 'block';
    }

    function setEditStatus(el, msg, type) {
      el.textContent  = msg;
      el.className    = 'edit-status ' + type;
      el.style.display = 'inline';
    }

    function esc(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
